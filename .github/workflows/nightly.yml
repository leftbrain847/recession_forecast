# Nightly: STEP 0 smoke test of every source, build signals JSON, deploy GitHub Pages, then commit the JSON to main.
# Deploy runs before the commit so a rejected push (branch protection, race) never blocks the page.
name: nightly
on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily (after FRED's overnight updates)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/**", "pipeline/**", "docs/index.html", ".github/workflows/nightly.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Step 0 - smoke test every source (fails loudly)
        run: python -m pipeline.smoke
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Build signals
        run: python -m pipeline.build
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/signals.json
          git diff --cached --quiet || (git commit -m "data: nightly signals $(date -u +%F)" && git pull --rebase -q origin main && git push)
